[project]
name = "complainerr"
version = "0.1.0"
description = "CLI to file complaints (aduan, cadangan, penghargaan) on Malaysian SISPAA agency sites"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "click>=8.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
complainerr = "complainerr.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
