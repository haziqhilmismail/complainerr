<script language=javascript>
	function switchAtchTyp(typ)
	{
		if (typ == "general")
		{
			document.getElementById("general").style.display = "block";
			document.getElementById("letter").style.display = "none"; 
			document.getElementById("group").style.display = "none";
		}
		else if (typ == "group")
		{
			document.getElementById("general").style.display = "none";
			document.getElementById("letter").style.display = "none"; 
			document.getElementById("group").style.display = "block";
		}
		else
		{
			document.getElementById("letter").style.display = "block";
			document.getElementById("general").style.display = "none";  
			document.getElementById("group").style.display = "none";
		}
	}
	
	function confirmTrash ( faGrp, fileId, docName )
	{
		var param = "&totSize="+document.forms[0].totSize.value+"&src="+document.forms[0].src.value;
		
			param += "&src="+document.forms[0].src.value;
		
		
		
		
		
			param += "&fcntElementId="+document.forms[0].fcntElementId.value;
		
		
		
			param += "&flstElementId="+document.forms[0].flstElementId.value;
		

		param += "&faGrp="+faGrp;
		
		if (confirm('Are you sure to remove this attachment file? File Name : ' + docName))
		{
			window.location.href="/eApps/atchmgmt/FileAtch/trash.do?faIid=" + fileId + param ;
		}	
	}
	
	function closeWin()
	{
		

		
			var elementObj=window.opener.document.getElementById? window.opener.document.getElementById("fileCnt"): window.opener.document.all.fileCnt;
			if (elementObj != null)
				elementObj.innerHTML=document.forms[0].reccnt.value;
			

		

		
			var elementObj=window.opener.document.getElementById? window.opener.document.getElementById("fileList"): window.opener.document.all.fileList;
			
		
	}
	
	function chkUploadFile(atchTyp)
	{
		if (atchTyp == 'ATCH')
		{
			if (document.forms[0].faDocName.value == '')
			{
				alert('No file selected for upload');
				return false;
			}
			
			atchLoadDiv = document.getElementById('loadImgAtch');
			atchDiv = document.getElementById('btnAtch');
			
			atchLoadDiv.style.display = "block";
			atchDiv.style.display = "none";
		}
		else if (atchTyp == 'GRP')
		{			
			grpLoadDiv = document.getElementById('loadImgGrp');
			grpDiv = document.getElementById('btnGrp');
			
			grpLoadDiv.style.display = "block";
			grpDiv.style.display = "none";
		}
		else if (atchTyp == 'LTR')
		{
			if (document.forms[0].faLtrName.value == '')
			{
				alert('No file selected for upload');
				return false;
			}
			
			ltrLoadDiv = document.getElementById('loadImgLtr');
			ltrDiv = document.getElementById('btnLtr');
			
			ltrLoadDiv.style.display = "block";
			ltrDiv.style.display = "none";
		}

		document.forms[0].submit();
	}	
	
	function popUpWindowDownload(pathUrl, fileName, contentType)
	{	
		var urlajax = "/eApps/sdmscase/SdmsCase/ajaxGenAtchPath.do";
		
		if (document.forms[0].src.value == 'SDMSCOMM' || document.forms[0].src.value == 'SDMSPOOL')
			urlajax = "/eApps/sdmscasepool/SdmsCasePool/ajaxGenAtchPathCasePool.do";
	
	    jQuery.ajax({
			url: urlajax,
			dataType: 'text',
			type: 'POST',
			data: 'fileName=' + encodeURIComponent(fileName) + '&pathUrl=' + encodeURIComponent(pathUrl) + '&contentType=' + encodeURIComponent(contentType),
			success: function(data)
	        {
			    var popwin = window.open(data,'WinDownload','width=100,height=100,resizable=yes,scrollbars=yes');
			    popwin.focus();
			}
		});
	}
	
	function popUpLtrList()
	{
		var url = '/eApps/sdmsaction/SdmsAction/listltr.do?fldTarget=rpDetail&fldSubject=rpSubject&fldRichText=Y&caseId=';
		popUpWin('WinPopupLtrList', 480, 500, 'resizable=yes,scrollbars=yes,statusbar=yes,status=yes', url);
	}

	function popUpGrpList()
	{
		var url = '/eApps/atchmgmt/FileAtch/listGrp.do?grpId=grpId';
		popUpWin('WinPopupGrpList', 480, 500, 'resizable=yes,scrollbars=yes,statusbar=yes,status=yes', url);
	}

	function checkFileSizeIE()
    {
     var myFSO = new ActiveXObject("Scripting.FileSystemObject");
     var filepath = document.uploadForm.faDocName.value;
     var thefile = myFSO.getFile(filepath);
     var size = thefile.size;
     alert(size); 
    }

	function removeGroup(id)
	{
		  jQuery("#remove"+id).remove(); 
	}

	window.onload = closeWin;
</script>
